<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kessel Optics</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Kessel Optics, an independent lens maker in Pune. Unofficial concept.">
<meta name="theme-color" content="#15171c">
<meta name="color-scheme" content="dark">
<meta name="claude:viewport-fit-sides" content="cover">
<script>
  // Before first paint: mark JS on, and pick the route from the address so
  // only that page is ever drawn. A fresh load always starts at the top.
  (function () {
    var d = document.documentElement, m = /*%%ROUTEMAP%%*/{};
    d.classList.add('js');
    try { history.scrollRestoration = 'manual'; } catch (e) {}
    var h = location.hash.slice(1);
    try { h = decodeURIComponent(h); } catch (e) {}
    h = h.replace(/(^|&)debug(=1)?$/, '');
    window.__kesselRoutes = m;
    d.setAttribute('data-route', m[h] || 'home');
  })();
</script>
<style>/*%%CSS%%*/</style>
</head>
<body>
<!-- No element is named "top": a link to #top then goes to the very top
     of the page (HTML's own rule), above the badge and the stills notice. -->
<a class="skip" href="#main" data-skip>Skip to content</a>

<!-- Which version of the page is running, always visible. Without JS this
     default text stays; with JS the bootstrap below replaces it at once. -->
<div class="tier" id="tier" role="status" aria-live="polite" data-kind="stills">
  <span class="tier__kind">STILLS</span>
  <span class="tier__why">JavaScript is off, so these are still frames, not the live lens.</span>
  <button class="tier__play" type="button" hidden>Play the live version</button>
  <button class="tier__toggle" type="button" aria-expanded="false" hidden><span class="sr-only">Why this version</span></button>
</div>
<script>
  // Runs before first paint: from here on the badge reports what is
  // actually happening instead of the no-JS default.
  (function () {
    var t = document.getElementById('tier');
    t.querySelector('.tier__why').textContent = 'Starting the live lens…';
    window.__kesselBootStarted = Date.now();
  })();
</script>

<!--%%HEADER%%-->

<div class="stage" id="stage" aria-hidden="true">
  <!-- The ring layer is masked under the header band so the engraved text
       never runs into the navigation. -->
  <div class="ring-layer">
    <svg class="ring-text" viewBox="0 0 1000 1000" focusable="false">
      <defs><path id="ringpath" d="M500,500 m-430,0 a430,430 0 1,1 860,0 a430,430 0 1,1 -860,0"/></defs>
      <text><textPath href="#ringpath" startOffset="0">KESSEL OPTICS &#183; HAND-ASSEMBLED LENSES &#183; PUNE &#183; EST. 2017 &#183; KESSEL OPTICS &#183; HAND-ASSEMBLED LENSES &#183; PUNE &#183; EST. 2017 &#183;</textPath></text>
    </svg>
  </div>
  <div class="stage__readout" id="readout"></div>
</div>

<main id="main" tabindex="-1">
<!--%%ROUTES%%-->
</main>

<!-- The site shell (routes, menu, enquiries) runs first; the lens follows. -->
<script>/*%%SITE%%*/</script>
<!-- Libraries: wrapped in a function so the browser only pre-parses them;
     they compile and run when the live lens is actually started. -->
<script>/*%%LIBS%%*/</script>
<script>/*%%APP%%*/</script>
</body>
</html>
